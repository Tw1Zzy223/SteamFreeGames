plugins { id 'com.android.application' }

android {
    namespace 'com.steamhunter.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.steamhunter.app'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.4.0'
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('STEAM_HUNTER_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('STEAM_HUNTER_STORE_PASSWORD')
                keyAlias System.getenv('STEAM_HUNTER_KEY_ALIAS')
                keyPassword System.getenv('STEAM_HUNTER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.work:work-runtime:2.11.2'
}
