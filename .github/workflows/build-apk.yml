name: Собрать APK

on:
  push:
    branches: [main, 'agent/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Собрать APK
        env:
          STEAM_HUNTER_STORE_PASSWORD: ${{ secrets.STEAM_HUNTER_STORE_PASSWORD }}
          STEAM_HUNTER_KEY_PASSWORD: ${{ secrets.STEAM_HUNTER_KEY_PASSWORD }}
          STEAM_HUNTER_KEY_ALIAS: ${{ secrets.STEAM_HUNTER_KEY_ALIAS }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/steam-hunter-release.jks
          export STEAM_HUNTER_KEYSTORE="$GITHUB_WORKSPACE/android/steam-hunter-release.jks"
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk Steam-Hunter.apk
      - name: Сохранить APK в GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Steam-Hunter-APK
          path: Steam-Hunter.apk
      - name: Добавить APK в GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Steam Hunter ${{ github.ref_name }}
          generate_release_notes: true
          files: Steam-Hunter.apk
